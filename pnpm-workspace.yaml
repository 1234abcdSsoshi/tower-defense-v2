# pnpm の設定はこのファイルが正（pnpm 10 以降、package.json の "pnpm" は読まれない）。

# 依存のインストール時スクリプトは既定で止まる。走らせてよいものをここで名指しする。
#
# esbuild は postinstall でプラットフォーム用のバイナリを用意する。
# 許可しないと vite も vitest も起動しない。
#
# 新しく許可を求められたら pnpm が名前を教えてくれるので、
# 「それが何をするスクリプトか」を確かめてから足すこと。
# ここは、他人のコードに実行権を与える場所にあたる。
allowBuilds:
  esbuild: true
